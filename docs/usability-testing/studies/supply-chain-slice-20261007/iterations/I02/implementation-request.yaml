requirements_delta:
  - 拆开看列出全部动作；手机端拆开看紧凑显示，不遮住半屏。
  - 手机端从第 1 天起只显示回到负责人的两条委托（可展开全部 7 条）；手机端隐藏首屏阅读说明列表；库存图在手机上按真实宽度绘制。
  - 决策面板写明 v1/v2 的含义。
  - 首屏常驻一行「已实现 / 产品方向（本页为模拟）」，措辞与页尾一致。
  - 第 1 天 AutoMage 催问未回复的同事。
  - 引导语用一句白话说明 AutoMage 是什么（冻结定义的转述）。
