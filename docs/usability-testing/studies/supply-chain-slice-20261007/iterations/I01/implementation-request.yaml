requirements_delta:
  - 拆开视图与重放在相关时刻出现浏览控件样式的邀请；重放在处理完第 6 天后即可进入，未解锁时说明原因。
  - 方案在签批前列出前提，建议附理由；签批后的决定 v1/v2 含义写明。
  - 人的签批进入当天的消息流，与 AutoMage 动作、系统消息区分。
  - 第 6 天先复核供应商 C 的现货与价格，再给办法或自行调整；首次与重放共享这段事件。
  - 工作单标明归属；「推演」改为「测算」；引导语不用「浅色纸面」；回执解释为对方的确认。
  - 窄屏显示全部 7 条委托；「回到你这里」改为非交互标记；首屏提供「哪些已经实现？」链接。
