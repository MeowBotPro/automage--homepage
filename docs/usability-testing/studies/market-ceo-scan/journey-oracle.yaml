    role: trade-services-ceo
    semantic_milestones:
      - 找到销售或客服相关项
      - 打开一项并读到输入或产出
      - 若存在了解清单，能放入至少两项且不出现安装成功
invariants:
  - 页面不得出现 Console 开通或安装命令
  - 选择不得被理解成部署成功
