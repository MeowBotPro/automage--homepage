server {
    listen 80;
    listen [::]:80;
    server_name skill-update.automage.cn;
    location /.well-known/acme-challenge/ { root /var/www/automage-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skill-update.automage.cn;
    ssl_certificate /etc/letsencrypt/live/skill-update.automage.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skill-update.automage.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 300m;
    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_body_timeout 600s;
    }
}
